payors:
  - id: ga_medicaid
    name: "Georgia Medicaid (straight / Katie Beckett)"
    rules:
      - type: required_document
        params: {doc: "GA Medicaid PA cover sheet (Appendix D)"}
        source: ga_medicaid_asd_manual
        section: "802.6 / 803.11; Appendix D"
        page: 25
        quote: "802.6. Medicaid Cover Page (Appendix D)"
        verified: false
      - {type: required_document, params: {doc: "Diagnostic evaluation"}, source: ga_medicaid_asd_manual, section: "802.1 / 803.1", page: 26, verified: false}
      - {type: required_document, params: {doc: "Letter of medical necessity"}, source: ga_medicaid_asd_manual, section: "802.2 / 803.2", page: 26, verified: false}
      - type: required_document
        params: {doc: "Proposed plan of care", when: treatment}
        source: ga_medicaid_asd_manual
        section: "803.4"
        page: 26
        quote: "803.4. Proposed Plan of Care (POC)"
        verified: false
      - type: required_document
        params: {doc: "Updated data from previous authorization", when: reauth, max_age_months_before_effective: 2}
        source: ga_medicaid_asd_manual
        section: "803.5"
        page: 26
        quote: "This data should reflect the member’s current performance and must not be more than two months older than the effective date of the requested prior authorization."
        verified: false
        notes: "Probe data is also expected for goals that were baselined but not yet introduced."
      - type: required_document
        params: {doc: "IFSP", when: if_applicable}
        source: ga_medicaid_asd_manual
        section: "802.3 / 803.6"
        page: 26
        quote: "803.6. Individualized Family Service Plan (if applicable)."
        verified: false
      - {type: required_document, params: {doc: "IEP", optional: true}, source: ga_medicaid_asd_manual, section: "803.7", page: 26, verified: false}
      - type: required_document
        params: {doc: "Most recent IEP, IFSP, and/or 504 plan", when: school_based_public_school}
        source: ga_medicaid_asd_manual
        section: "804.12"
        page: 28
        quote: "The most recent Individualized Education Plan (IEP), Individualized Family Support Plan (IFSP), and/or 504 plan should be included for members who attend a public school."
        verified: false
        notes: "Not required for private school or homeschool. Applies when school-based services are requested."
      - type: plan_content
        params:
          must_include: [background, medications, parent_concerns, assessment_results, skill_goals, caregiver_goals, coordination_of_care, transition_plan, discharge_criteria, crisis_plan]
          must_include_if_applicable: [behavior_goals, telehealth_readiness]
          signed_by: BCBA
        source: ga_medicaid_asd_manual
        section: "Appendix D, Checklist A.iii"
        page: 45
        quote: "Plan of Care (Initial Treatment Plan or Progress Report) including the following:"
        verified: false
        notes: "Signature may be a BCBA or BCBA-D."
      - type: plan_content
        params: {must_include: [evaluation_date]}
        source: ga_medicaid_asd_manual
        section: "801.2"
        page: 22
        quote: "Include the date it was completed and include the tests administered with scores."
        verified: false
      - type: submission_channel
        params: {channel: portal, name: "Georgia Medical Review Portal", separate_requests: ["initial assessment"], consolidated_ongoing: true}
        source: ga_medicaid_asd_manual
        section: "Appendix E B.xiv.2.a"
        page: 50
        quote: "Once a member has completed their initial behavioral assessment, the initial treatment PA, and all subsequent ongoing PAs, must be submitted as a single consolidated request."
        verified: false
        notes: "The same manual's Appendix E B.iii/iv (page 48) still describes separate assessment and treatment PAs. Confirm with DCH (question 24)."
      - type: unit_basis
        params: {assessment_increment_months: 3, treatment_periods_weeks: [13, 26]}
        source: ga_medicaid_asd_manual
        section: "801; Appendix D"
        page: 43
        quote: "# of units/3 mths (13 wks) / # of units/6 mths (26 wks)"
        verified: false
        notes: "Section 801: assessment PAs in 3-month increments, treatment PAs in 6-month increments (up to 26 weeks)."
      - type: signature_type
        params: {document: "cover sheet", requirement: "Secure electronic signatures are acceptable; rubber stamps are not. The practice checklist says wet signature only."}
        source: ga_medicaid_asd_manual
        section: "602.3.4"
        page: 17
        quote: "Rubber stamp signatures are not acceptable. Secure Electronic Signatures are acceptable"
        verified: false
        notes: "Confirm with DCH/CMO before relying on e-signature for the cover sheet."
      - type: supervision_ratio
        params: {min_pct_of_hours_per_month: 10, max_pct_authorized: 20}
        source: checklist_2026
        verified: false
        notes: "DCH manual sets no percentage (defers to BACB). May be CMO-specific."
      - type: decision_timeframe
        params: {standard_days: 7, expedited_hours: 72, from: "2026-01-01"}
        source: cms_0057_f_presentation
        section: "Prior authorization decision timeframes"
        verified: false
        notes: "Federal ceiling for Medicaid fee-for-service and managed care; contracts may be stricter."
      - type: decision_timeframe
        params: {standard_days: 7, day_type: calendar, supplemental_documentation_days: 10}
        source: ga_medicaid_asd_manual
        section: "Appendix E B.viii"
        page: 49
        quote: "Please allow up to 7 calendar days for the PA request to be reviewed and a decision issued. If it is necessary for a provider to submit supplemental documentation to resolve a technical or peer denial, an additional 10 calendar days for the reviewer to complete the review and render a decision is required."
        verified: false
      # From the official documents review (ga_medicaid)
      - type: required_document
        params: {"doc": "Skill acquisition line graphs (per goal)", "when": "reauth"}
        source: ga_medicaid_asd_manual
        section: "803.10 (new in Q4)"
        page: 26
        quote: "Providers shall submit skill acquisition line graphs with continued treatment authorization requests."
        verified: false
      - type: required_document
        params: {"doc": "Progress summary for each behavior targeted for reduction", "when": "if_applicable", "must_address": ["data variability", "intervention effectiveness", "modifications"]}
        source: ga_medicaid_asd_manual
        section: "803.9"
        page: 26
        quote: "Progress summaries, if applicable, are required for each behavior targeted for reduction. These summaries should address data variability, clarify the effectiveness of current intervention strategies, and describe any modifications implemented."
        verified: false
      - type: required_document
        params: {"doc": "Previous hospitalization or out-of-home placement documents", "when": "if_applicable"}
        source: ga_medicaid_asd_manual
        section: "803.8"
        page: 26
        quote: "803.8. Previous Hospitalization or out-of-home placement documents (if applicable)."
        verified: false
      - type: required_document
        params: {"doc": "Telehealth Readiness Checklist (Appendix D)", "when": "telehealth", "sections": ["general", "per CPT code requested"]}
        source: ga_medicaid_asd_manual
        section: "903.3 Telehealth Services"
        page: 33
        quote: "The Telehealth Readiness Checklist (located in Appendix D) must be completed for all services delivered via telehealth and submitted as supporting documentation with the prior authorization (PA) request."
        verified: false
      - type: plan_content
        params: {"diagnostic_eval_requires": {"clinician_tools_min": 1, "caregiver_tools_min": 1}, "cars_gars_both_versions_count_once": true, "school_psychoeducational_accepted": false}
        source: ga_medicaid_asd_manual
        section: "Appendix D, A. Checklist, i.1"
        page: 45
        quote: "Diagnostic Evaluation Requires One (1) Clinician Tool and One (1) Caregiver Tool from the Acceptable Tools List"
        verified: false
      - type: plan_content
        params: {"goal_must_include": ["baseline", "measurement_method", "mastery_criteria"], "per_goal_also": ["medical_necessity_rationale", "date_of_introduction", "projected_mastery"]}
        source: ga_medicaid_asd_manual
        section: "804. Plan of Care"
        page: 27
        quote: "Each goal must include baseline data, measurement methods, and mastery criteria designed to address the core deficits of ASD, consistent with the practice guidelines for treatment of ASD established by the Behavior Analyst Certification Board (BACB)."
        verified: false
      - type: plan_content
        params: {"caregiver_goals_min": 2, "caregiver_goals_max": 4, "presence_alone_insufficient": true}
        source: ga_medicaid_asd_manual
        section: "Appendix D, Parent/Caregiver Training Goals"
        page: 44
        quote: "Parents/caregivers being present during the session is not sufficient for a parent/caregiver training goal. You are required to document and track 2 – 4 goals."
        verified: false
      - type: plan_content
        params: {"assessment_graph_label": ["member_initials", "date_mm/dd/yyyy"], "assessment_max_age_months_before_treatment_effective": 2}
        source: ga_medicaid_asd_manual
        section: "Appendix D, Graph date format"
        page: 44
        quote: "The behavior assessment graph should include the member initials as well as the date in a month/day/year format and must be conducted/dated no more than two (2) months prior to the Treatment Services PA request effective date."
        verified: false
      - type: plan_content
        params: {"typical_hours_per_week": [10, 30], "enhanced_review_over_hours_per_week": 30, "warn_only": true}
        source: ga_medicaid_asd_manual
        section: "803 (paragraph below 803.12)"
        page: 27
        quote: "Treatment services typically range from 10 to 30 hours per week, though the amount may be higher or lower when medically necessary. Requests exceeding 30 hours per week will undergo an enhanced authorization review."
        verified: false
      - type: plan_content
        params: {"when": "reauth", "must_include": ["summary of previous goals and progress", "recent behavioral assessment", "individualized goals for individual and caregivers"], "assessment_max_age_months": 2}
        source: ga_medicaid_asd_manual
        section: "803 (follow-up PA requests)"
        page: 27
        quote: "PA requests for follow up services (following the initial treatment PA) must include 1) a summary of previous goals and progress, 2) the results of a recent Behavioral Assessment (within 2 months), and 3) individualized goals for the individual and caregivers"
        verified: false
      - type: plan_content
        params: {"when": "school_based_services", "must_include": ["operationally defined target behaviors with baseline and current levels", "days/times of high frequency/intensity/duration", "behavior reduction and replacement goals", "titration plan for fading school services", "school-setting line graphs with phase change lines", "accompanying home and/or clinic plan"]}
        source: ga_medicaid_asd_manual
        section: "804.7-804.12"
        page: 27
        quote: "School plans will be reviewed for medical necessity; therefore, clinical documentation must be clearly outlined to detail the maladaptive behaviors that the member exhibits that requires the need for intensive support services in the school setting."
        verified: false
      - type: plan_content
        params: {"code": "97154", "group_size_min": 2, "group_size_max": 8}
        source: ga_medicaid_asd_manual
        section: "Appendix F, Group Goals"
        page: 57
        quote: "Group sessions billed under 97154 must include a minimum of two participants and may not exceed eight."
        verified: false
      - type: concurrent_billing
        params: {"codes": ["97154", "97158"], "allowed": false}
        source: ga_medicaid_asd_manual
        section: "Appendix D, note below Proposed Service Schedule"
        page: 43
        quote: "97154 and 97158 should not be billed concurrently."
        verified: false
      - type: unit_basis
        params: {"units_per_hour": 4, "formula": "hours x 4 units x weeks", "example_weeks": 26, "example_months": 6}
        source: ga_medicaid_asd_manual
        section: "Appendix F, Requested CPT Codes"
        page: 60
        quote: "Use the formula: Hours × 4 units × number of weeks (e.g., 26 weeks = 6 months)."
        verified: false
      - type: request_timing
        params: {"submit_up_to_months_before_effective": 2}
        source: ga_medicaid_asd_manual
        section: "Appendix E, B.vi"
        page: 48
        quote: "Requests may be submitted up to 2 months before the PA’s effective date (for example, a PA starting 6/1/2026 may be submitted as early as 4/1/2026)."
        verified: false
      - type: request_timing
        params: {"effective_date_backdate_max_days": 30, "retro_otherwise_allowed": false}
        source: ga_medicaid_asd_manual
        section: "Appendix E, B.x"
        page: 49
        quote: "providers may set the PA effective date for up to 30 days prior to the submission date."
        verified: false
      - type: request_timing
        params: {"reassessment_codes_within_final_months_of_auth": 3, "reassessment_completed_max_months_before_next_auth": 2, "on": "consolidated PA"}
        source: ga_medicaid_asd_manual
        section: "Appendix E, B.xiv.2.a"
        page: 50
        quote: "Reassessment codes must be entered with an effective date no more than three months before the end of the requested authorization period, and the reassessment itself may not be completed more than two months prior to the start date of the next treatment authorization."
        verified: false
      - type: request_timing
        params: {"reconsideration_days_after_peer_denial": 30, "day_type": "calendar", "reconsiderations_after_first_peer_denial": 1}
        source: ga_medicaid_asd_manual
        section: "Appendix E, D. Reconsideration Request Guidelines"
        page: 51
        quote: "Peer consultant denied - requests must be submitted within 30 calendar days of the decision. Please Note: Providers are only permitted to submit one (1) reconsideration following the first peer denial."
        verified: false
      - type: staff_credential
        params: {"role": "BCBA", "requires": ["Active BACB certification", "Georgia Behavior Analyst license"], "grace_period": false}
        source: ga_medicaid_asd_manual
        section: "601.1.2 Enrollment (new in Q4)"
        page: 8
        quote: "To enroll as a BCBA/BCBA-D Medicaid provider, practitioners must maintain an active certification issued by the BACB and hold a valid license from the Georgia Behavior Analyst Licensing Board."
        verified: false
      - type: staff_credential
        params: {"role": "technician", "must_be": "RBT", "supervised_by": ["BCBA", "BCBA-D", "BCaBA"]}
        source: ga_medicaid_asd_manual
        section: "601.1.1.6 Registered Behavior Technician"
        page: 8
        quote: "601.1.1.6. Registered Behavior Technician (RBT): 601.1.1.6.1. Paraprofessional who implements the service plan under supervision of a BCBA/BCBA-D 601.1.1.6.2. May not be the enrolled QHCP. 601.1.1.6.3. Must be supervised by a BCBA/BCBA-D or BCaBA"
        verified: false
      - type: event_trigger
        params: {"event": "bcba_transfer_same_company", "requires": "Receiving behavior analyst reviews and attests the treatment plan"}
        source: ga_medicaid_asd_manual
        section: "802. Behavioral Assessment"
        page: 25
        quote: "If a member transfers to another provider within the same company during a period covered under an active PA, the behavior analyst receiving the transferred member must review and attest that the treatment plan has been approved."
        verified: false
      - type: event_trigger
        params: {"event": "additional_units_requested", "requires": "Updated signed LMN/POC and treatment plan addendum with new goals and baseline data"}
        source: ga_medicaid_asd_manual
        section: "Appendix E, F. Change Request Guidelines"
        page: 52
        quote: "A significant change in treatment needs must be documented by submission of an updated and signed LMN/POC uploaded to the web portal. If additional units are requested, a treatment plan addendum that outlines the new goals with baseline data is required."
        verified: false
      - type: event_trigger
        params: {"event": "diagnosis_older_than_years_without_ongoing_treatment", "years": 5, "requires": "Diagnostic re-evaluation with at least 1 clinician observational assessment", "may_be_required": true}
        source: ga_medicaid_asd_manual
        section: "801.10"
        page: 24
        quote: "801.10. More than 5 years from initial diagnosis and no evidence of ongoing assessment and treatment The re-evaluation must include, at a minimum, 1 clinician observational assessment."
        verified: false

  - id: peach_state
    name: "Peach State Health Plan (GA Medicaid CMO)"
    inherits: ga_medicaid
    rules:
      - {type: request_timing, params: {code: "97151", with_other_codes: true}, source: checklist_2026, verified: false}

  - id: amerigroup
    name: "Amerigroup (GA Medicaid CMO)"
    inherits: ga_medicaid
    rules:
      - {type: request_timing, params: {code: "97151", separate_request: true, months_before_auth_end: 3}, source: checklist_2026, verified: false}
      - {type: event_trigger, params: {event: bcba_transfer, requires: "Transition of care form"}, source: checklist_2026, verified: false}
      - {type: required_document, params: {doc: "Amerigroup GA Medicaid cover page"}, source: checklist_2026, verified: false}

  - id: aetna
    name: "Aetna (commercial)"
    rules:
      - {type: required_document, params: {doc: "Aetna ABA Treatment Request (GR-69017-4)"}, source: aetna_aba_request_gr69017_4, verified: false}
      - type: submission_channel
        params: {channel: portal, name: "Availity", note: "Initial request starts on Availity; form is not used to initiate. Clinical fax: FaxHub"}
        source: aetna_aba_request_gr69017_4
        verified: false
        notes: "The office manual (6/26) says to call the number on the member's ID card for ABA precertification. Question 25."
      - type: submission_channel
        params: {channel: phone, name: "Number on the member's Aetna ID card"}
        source: aetna_office_manual
        section: "Prior authorization for ABA"
        page: 71
        quote: "To get ABA services precertified, call the number on the member’s Aetna ID card and speak to a Member Services representative."
        verified: false
        notes: "Conflicts with GR-69017-4 (effective 2026-08-01), which starts initial requests on Availity. Question 25."
      - {type: form_address, params: {use: service_state_office}, source: checklist_2026, verified: false}
      - type: supervision_ratio
        params: {min_hours_per_10_direct: 1, max_hours_per_10_direct: 2, basis: authorization}
        source: aetna_aba_mn_guide
        section: "Assessment of symptom severity"
        page: 4
        quote: "additional authorization may be provided for QHP protocol modification and direction at 1 to 2 hours per 10 hours of treatment by protocol"
        verified: false
        notes: "An authorization amount for 97155 relative to 97153, not a per-technician minimum."
      - type: supervision_ratio
        params: {min_pct_per_technician: 10, min_onsite_face_to_face_hours_per_month: 1}
        source: checklist_2026
        verified: false
        notes: "No official source found for the monthly on-site hour."
      - {type: event_trigger, params: {event: plan_is_aetna_better_health_medicaid, requires: "Aetna Better Health request form (different form)"}, source: checklist_2026, verified: false}
      # From the official documents review (aetna)
      - type: staff_credential
        params: {"role": "ABA practitioner treating ASD", "must_be_any_of": ["BACB certification", "State behavior analyst license"]}
        source: aetna_office_manual
        section: "The Aetna ABA Medical Necessity Guide"
        page: 70
        quote: "For practitioners treating autism spectrum disorders using ABA, either national certification is needed from the Behavior Analyst Certification Board (BACB), or the practitioner must be licensed as a behavior analyst in the state in which they practice."
        verified: false
      - type: plan_content
        params: {"diagnosis_required": "DSM-V Autism Spectrum Disorder", "icd10": ["F84.0", "F84.3-F84.9"], "diagnosed_by": "appropriate provider"}
        source: aetna_aba_mn_guide
        section: "Medical necessity criteria for ABA"
        page: 3
        quote: "There is a DSM-V diagnosis of Autism Spectrum Disorder (ICD-10: F84.0; F84.3 - F84.9) obtained by an appropriate provider."
        verified: false
      - type: plan_content
        params: {"must_include": ["target_behaviors_operationally_defined", "baseline_measures", "quantifiable_progress_criteria", "intervention_techniques_per_target", "reinforcers_selected", "generalization_strategies", "transition_plan", "titration_criteria", "discharge_criteria", "gradual_tapering_of_intensity"]}
        source: aetna_aba_mn_guide
        section: "Medical necessity criteria for ABA"
        page: 3
        quote: "The plan describes behavioral intervention techniques appropriate to the target behavior, reinforcers selected, and strategies for generalization of learned skills are specified. And there is documentation of planning for transition through the continuum of interventions, services and settings, as well as titration and discharge criteria."
        verified: false
      - type: plan_content
        params: {"when": "reauth", "must_include": ["progress_documentation_or_treatment_modification"]}
        source: aetna_aba_mn_guide
