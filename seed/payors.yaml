    name: "BCBS via Lucet (behavioral health manager)"
    rules:
      - {type: plan_content, params: {must_include: [transition_fade_plan_tied_to_goals, generalization_to_caregivers, care_coordination, discharge_plan]}, source: null, verified: false, notes: "From one approval letter's next-request requirements; letter-derived rules are per-auth, not global"}

  # Rules both TRICARE regions share. Rules the East documents restate are in each region's extra_rules.
  - id: tricare_east
    name: "TRICARE East (Humana Military)"
    rules: &tricare_common
      - {type: daily_cap, params: {all_services_hours: 8}, source: checklist_2026, verified: false}
      - {type: daily_cap, params: {code: "97155", hours: 2}, source: checklist_2026, verified: false}
      - {type: daily_cap, params: {code: "97156", hours: 2}, source: checklist_2026, verified: false}
      - {type: min_sessions_per_auth, params: {code: "97156", min_sessions: 6, auth_months: 6}, source: checklist_2026, verified: false}
      - type: supervision_ratio
        params: {code: "97155", min_in_person_sessions_per_client_per_month: 1, by: "TRICARE-credentialed BCBA", severity_if_missed: hard_alert}
        source: checklist_2026
        verified: false
        notes: "Missing a single month is a recoupment audit risk"
      - type: outcome_measure_schedule
        params:
          initial: [PDDBI_parent, Vineland-3, SRS-2, "PSI (age 0-12) or SIPA (age 11-19)"]
          every_6_months: [PDDBI_parent, PDDBI_teacher_or_BCBA, "PSI or SIPA"]
          annually: [Vineland-3, SRS-2]
          every_2_years: [two_year_review]
          full_publisher_report_required: true
        source: checklist_2026
        verified: false
        notes: "The teacher/BCBA PDDBI form, PSI/SIPA age bands, and full publisher report are not in the East handbook or FAQ."
      - type: request_timing
        params: {report_due_days_after_assessment: 14}
        source: checklist_2026
        verified: false
        notes: "No official document found states this (question 27). The FAQ's 14-day figure is the window to complete 97151."
      - {type: unit_limit, params: {code: "97151", initial_units: 32, initial_outcome_units: 3, reassessment_units: 24}, source: checklist_2026, verified: false}
      - {type: staff_credential, params: {when: bcaba_delegated_codes, requires: "BCaBA attestation"}, source: checklist_2026, verified: false}
    extra_rules:
      - {type: required_document, params: {doc: "ABA reassessment request (optional guide form)"}, source: humana_military_aba_reassessment, verified: false}
      - type: staff_credential
        params: {role: technician, must_be_any_of: [RBT, ABAT, BCAT]}
        source: humana_aba_faq_xpbb0825
        section: "National certification boards"
        page: 2
        quote: "Registered Behavior Technicians (RBT) • Qualified Applied Behavior Analysis Certification Board (QABA) • Qualified Autism Services Practitioner (QASP) • Applied Behavior Analysis Technician (ABAT) • Behavioral Intervention Certification Council (BICC) • Board Certified Autism Technician (BCAT)"
        verified: false
        notes: "Under the list: providers must meet the TRICARE Operations Manual and state law, which may be stricter; the practice checklist says RBT only (question 26)."
      - type: concurrent_billing
        params: {codes: ["97153", "97155"], allowed: false, outcome: "higher rate paid, other denied"}
        source: humana_aba_faq_xpbb0825
        page: 5
        quote: "If CPT 97153 and 97155 are billed concurrently, the higher rate will be paid and the other will be denied."
        verified: false
      - type: outcome_measure_schedule
        params:
          initial: [PDDBI, Vineland-3, SRS-2, "PSI or SIPA"]
          every_6_months: [PDDBI, "PSI or SIPA"]
          annually: [Vineland-3, SRS-2]
        source: tricare_east_provider_handbook_2026
        section: "ACD covered services"
        page: 30
        quote: "PDDBI/ PSI/SIPA are due with every six-month reauthorization; Vineland 3 and SRS-2 are due every year"
        verified: false
      - type: request_timing
        params: {submit_up_to_days_before_auth_end: 60, day_type: calendar}
        source: tricare_east_provider_handbook_2026
        page: 50
        quote: "Providers may submit reauthorization requests as early as 60 calendar days prior to the end"
        verified: false
      # From the official documents review (tricare_east)
      - type: required_document
        params: {"doc": "ACD ABA referral (must specify ABA)", "required_before": "start_of_aba", "renew_every_years": 2, "from": ["TRICARE-authorized PCM", "specialized ASD-diagnosing provider"]}
        source: tricare_east_provider_handbook_2026
        section: "Referral and authorization requirements for ABA services"
        page: 50
        quote: "A complete referral for Applied Behavioral Analysis (ABA) services under the Autism Care Demonstration (ACD) is required for all TRICARE-eligible beneficiaries prior to the start of ABA services and every two years"
        verified: false
      - type: required_document
        params: {"doc": "DHA-approved DSM-5 checklist", "requires": ["asd_criteria", "current_level_of_support"]}
        source: tricare_east_provider_handbook_2026
        section: "Referral and authorization requirements for ABA services"
        page: 50
        quote: "A Defense Health Agency (DHA)-approved DSM-5 checklist documenting ASD criteria and the current level of support needed"
        verified: false
      - type: required_document
        params: {"doc": "Validated ASD assessment tool result (most current edition) plus diagnostic evaluation", "options": ["STAT", "ADOS-2", "ADI-R", "CARS-2", "GARS-3"]}
        source: tricare_east_provider_handbook_2026
        section: "Referral and authorization requirements for ABA services"
        page: 50
        quote: "A validated assessment tool (the most current edition) selected from this list must be submitted"
        verified: false
      - type: staff_credential
        params: {"role": "ASD diagnosing provider", "when": {"age_at_first_diagnosis_min_years": 8}, "must_be": "specialized ASD-diagnosing provider (not PCM)"}
        source: tricare_east_provider_handbook_2026
        section: "Referral and authorization requirements for ABA services"
        page: 50
        quote: "For beneficiaries first diagnosed with Autism Spectrum Disorder (ASD) at age eight years or older, a specialized ASD-diagnosing provider evaluation (not a PCM), meeting all diagnosis requirements is required"
        verified: false
      - type: required_document
        params: {"doc": "EFMP enrollment and ECHO registration", "when": "beneficiary is dependent of an ADSM", "retroactive_registration": false}
        source: tricare_east_provider_handbook_2026
        section: "Autism Care Demonstration (ACD)"
        page: 30
        quote: "Be enrolled in their service’s EFMP and registered in ECHO to receive ABA under the ACD if they are a dependent of an ADSM"
        verified: false
      - type: plan_content
        params: {"required_diagnosis_code": "F84.0"}
        source: tricare_east_provider_handbook_2026
        section: "Autism Care Demonstration (ACD)"
        page: 29
        quote: "The ACD provides TRICARE reimbursement for Applied Behavior Analysis (ABA) services to TRICARE-eligible beneficiaries diagnosed with Autism Spectrum Disorder (ASD, F84.0)."
        verified: false
      - type: request_timing
        params: {"retro_authorization_allowed": false}
        source: tricare_east_provider_handbook_2026
        section: "Referral and authorization requirements for ABA services"
        page: 50
        quote: "All ABA authorizations must be preauthorized; retrospective authorization is not allowed"
        verified: false
      - type: request_timing
        params: {"treatment_auth_period_months": 6, "basis": "TOM-compliant treatment plan"}
        source: tricare_east_provider_handbook_2026
        section: "Referral and authorization requirements for ABA services"
        page: 50
        quote: "If clinical necessity is met, treatment will be authorized for a six-month period"
        verified: false
      - type: outcome_measure_schedule
        params: {"baseline_required_before": "start_of_aba_treatment"}
        source: tricare_east_provider_handbook_2026
        section: "Referral and authorization requirements for ABA services"
        page: 50
        quote: "Baseline outcome measures must be completed prior to the start of ABA treatment"
        verified: false
      - type: plan_content
        params: {"prohibited_goal_domains": ["educational/academic", "vocational"], "enforced_at": "contractor approval"}
        source: tricare_east_provider_handbook_2026
        section: "Exclusions/Non-covered services under the ACD"
        page: 30
        quote: "All educational/academic and vocational goals must be removed from the TP prior to approval by the contractor"
