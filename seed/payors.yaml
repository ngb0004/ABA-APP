        quote: "If there has NOT been improvement, there is documentation of modification of the treatment, additional assessments that have been conducted, and/or there has been appropriate consultations from other staff or experts."
        verified: false
      - type: plan_content
        params: {"must_include": ["hours_justified_by_impairment_level"]}
