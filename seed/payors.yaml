        page: 3
        quote: "The level of impairment (calculated below) justifies the number of hours requested."
        verified: false
      - type: unit_limit
        params: {"guide_only": true, "per_domain": ["maladaptive_behavior", "social_communication", "self_care"], "hours_per_week_by_severity": {"none_lt_1sd": 0, "mild_gt_1sd": [1, 4], "moderate_gt_1_5sd": [4, 7], "severe_gt_2sd": [7, 10]}}
        source: aetna_aba_mn_guide
        section: "Assessment of symptom severity"
        page: 4
        quote: "None <1SD below Mild >1 SD below Moderate >1.5 SD below Severe >2SD below Functional impairment 0 Hours/Wk 1 to 4 Hours/Wk 4 to 7 Hours/Wk 7 to10 Hours/Wk"
        verified: false
      - type: outcome_measure_schedule
        params: {"progress_review_every_months": 6, "measure": "standardized measure"}
        source: aetna_aba_mn_guide
        section: "Termination of coverage of ABA"
        page: 4
        quote: "A member's progress is to be evaluated every six months. A member not making progress will be transitioned to other appropriate services."
        verified: false
      - type: plan_content
        params: {"must_include": ["objective_measurable_goals", "discharge_criteria", "goal_linked_to_presenting_problem", "goal_progress_timeframe", "progress_assessed_within_timeframe"]}
        source: aetna_office_manual
        section: "BH treatment record review criteria, items 14.1-14.3"
        page: 82
        quote: "Goals include a time frame for evaluating progress, and there is documentation indicating assessment of progress within those time frames."
        verified: false
      - type: plan_content
        params: {"must_include": ["member_identifier_every_page"], "filled_by": "system, never AI"}
        source: aetna_office_manual
        section: "BH treatment record review criteria, item 3"
        page: 81
        quote: "Member’s name or unique identifier appears on every page."
        verified: false
      - type: signature_type
        params: {"document": "all record entries", "requirement": "dated; author signature or electronic identifier with title and credentials", "electronic_allowed": true}
        source: aetna_office_manual
        section: "BH treatment record review criteria, item 4"
        page: 81
        quote: "All entries in the record are dated and contain the author’s signature or electronic identifier with title (if applicable) and credentials/degree."
        verified: false
      - type: required_document
        params: {"doc": "Signed consent for treatment"}
        source: aetna_office_manual
        section: "BH treatment record review criteria, item 6"
        page: 81
        quote: "There is a signed Consent for Treatment form."
        verified: false
      - type: required_document
        params: {"doc": "Signed release for communication with PCP/other practitioners", "alternative": "documented refusal or no other providers"}
        source: aetna_office_manual
        section: "BH treatment record review criteria, item 5"
        page: 81
        quote: "There is a signed release form for communication with a primary care practitioner and/or other medical or behavioral health practitioners. If not, there is documentation that the member declined to sign releases or is not currently under the care of other providers."
        verified: false
      - type: event_trigger
        params: {"events": ["initial_evaluation", "significant_treatment_plan_change", "termination_of_treatment"], "requires": "Written communication to PCP with member authorization", "recommended_within_weeks": 2, "warn_only": true}
        source: aetna_office_manual
        section: "Behavioral health care professional responsibilities for all levels of care"
        page: 73
        quote: "Note: It’s recommended that communication occur within two weeks of the above situations— if needed, the Physician Communication Form is located at Aetna.com."
        verified: false
      - type: submission_channel
        params: {"channel": "portal", "name": "Availity", "purpose": "upload clinical records to an authorization", "max_files_per_upload": 6, "max_file_mb": 32, "password_protected_allowed": false}
        source: aetna_office_manual
        section: "Authorization adds, inquiries and updates"
        page: 16
        quote: "Users can upload up to six electronic files at a time, with a size of 32MB per file, by clicking the Add Files button."
        verified: false

  - id: cigna_evernorth
    name: "Cigna / Evernorth"
    rules:
      - {type: required_document, params: {doc: "Evernorth ABA Prior Authorization Form"}, source: evernorth_aba_pa_928213d, verified: false}
      - {type: submission_channel, params: {channel: email, address: "ABA@Evernorth.com", preferred: true, fallback: fax, note: "Use fax number printed on current form; checklist number differs"}, source: evernorth_aba_pa_928213d, verified: false}
      - {type: unit_basis, params: {request_per: month, convert_from: week}, source: evernorth_aba_pa_928213d, verified: false}
      - {type: form_address, params: {use: service_state_office}, source: checklist_2026, verified: false}
      - type: supervision_ratio
        params: {min_hours_per_10_direct: 1, max_hours_per_10_direct: 2}
        source: cigna_en0499
        section: "Supervision / Direction of Treatment"
        page: 5
        quote: "indirect case supervision is consistent with the general accepted standard of care of one to two hours per ten hours of direct treatment."
        verified: false
        notes: "Same section: when direct treatment is 10 hours per week or less, at least 1 to 2 hours per week of direct case supervision."
      - type: supervision_ratio
        params: {hours_supervision_per_10_hours_direct: 1, per_technician: true, remote_allowed: true}
        source: checklist_2026
        verified: false
        notes: "Per-technician and remote supervision are not stated in EN0499."
      - {type: unit_limit, params: {code: "97151", purpose: progress_report, max_hours: 6}, source: checklist_2026, verified: false}
      - type: plan_content
        params: {guideline: "Evernorth Coverage Policy EN0499 Intensive Behavioral Interventions", updates: annually_december, monitor: true}
        source: cigna_en0499
        section: "Treatment plans"
        page: 14
        quote: "Treatment plans / plans of care include information to substantiate that the medical necessity criteria for Applied Behavior Analysis as outlined in Evernorth Behavioral Health Coverage Policy EN0499 Intensive Behavioral Interventions are met."
        verified: false
      # From the official documents review (cigna_evernorth)
      - type: required_document
        params: {"doc": "ASD diagnosis by independently licensed clinician", "must_include": ["diagnostician name", "credentials", "licensure type", "date of most recent diagnosis"]}
        source: cigna_en0499
        section: "Criteria for Initiation of Treatment with ABA > Diagnosis"
        page: 3
        quote: "The name, credentials, and type of licensure of the person who made the diagnosis"
        verified: false
      - type: outcome_measure_schedule
        params: {"measure": "reliable, valid, standardized assessment instrument", "phase": "initial", "max_days_before_treatment_start": 60}
        source: cigna_en0499
        section: "Criteria for Initiation > Assessment"
        page: 4
        quote: "Administration of the assessment instrument has been completed within 60 days prior to the start of treatment."
        verified: false
      - type: plan_content
        params: {"element": "assessment instrument details", "requires": ["completed in entirety", "current edition", "date of administration", "respondent/participant name", "form type", "standardized scores and score tables or grids"]}
        source: cigna_en0499
        section: "Assessment"
        page: 3
        quote: "must include the date of administration, name of the respondent and/or participant in the assessment, and the form type when applicable"
        verified: false
      - type: plan_content
        params: {"element": "dated quantitative baseline for all targets in all settings", "phase": "initial", "max_days_before_treatment_start": 60}
        source: cigna_en0499
        section: "Treatment Plan > Data and Reporting"
        page: 4
        quote: "Quantitative baseline data have been collected within 60 days prior to the start of treatment, with dates reported from when the data were collected."
        verified: false
      - type: plan_content
        params: {"element": "data reported separately by setting", "applies_when": "multiple settings"}
        source: cigna_en0499
        section: "Treatment Plan > Data and Reporting"
        page: 5
        quote: "quantitative data have been obtained, provided, and are clearly identified separately by location/setting for all behaviors and skills corresponding within each specific location of service"
        verified: false
      - type: plan_content
        params: {"element": "goal structure", "requires": ["target behavior", "measurement method", "operational definition", "degree of independence", "mastery criteria", "consistent units across data, goal and mastery"]}
        source: cigna_en0499
        section: "Treatment Plan > Data and Reporting"
        page: 5
        quote: "Each goal includes clearly defined mastery criteria indicating the standards for determining whether a goal/objective has been/will be met."
        verified: false
      - type: plan_content
        params: {"element": "interim data window", "min_months_covered": 6}
        source: cigna_en0499
        section: "Glossary > Interim Data"
        page: 12
        quote: "At a minimum, interim data should include data as collected within the previous 6 months of treatment (or less if treatment has been in place for less than 6 months), and may be reported as patient data points and/or as a relevant average."
        verified: false
      - type: plan_content
        params: {"element": "continued treatment current data window", "phase": "reauth", "current_data_max_days_before_continuation_start": 60, "current_data_max_days_before_request_received": 60}
        source: cigna_en0499
        section: "Criteria for Continued Treatment with ABA"
        page: 8
        quote: "There is documentation of current data must be collected within no more than 60 days prior to the start date of the continued treatment request, as well as collected within no more than 60 days prior to the date the authorization request is received"
        verified: false
      - type: outcome_measure_schedule
        params: {"measure": "reliable, valid, standardized assessment instrument", "phase": "reauth", "max_years_before_continuation_start": 1}
        source: cigna_en0499
        section: "Criteria for Continued Treatment with ABA"
        page: 8
        quote: "There is evidence of measurable and/or maintained improvement in targeted behaviors and skills as demonstrated with the use of a reliable, valid, and standardized assessment instrument completed no more than one year prior to the start date of the continued treatment request."
        verified: false
      - type: plan_content
        params: {"element": "continued treatment progress and barriers", "requires": ["updated plan", "baseline, interim and current data", "sustained progress", "barrier plan with protocol modification", "stakeholder progress data"]}
        source: cigna_en0499
        section: "Criteria for Continued Treatment with ABA"
        page: 8
        quote: "barriers toward progress and/or maintenance have been identified, and there is a specific and documented plan to address barriers and evidence of interventions being adjusted through protocol modification"
        verified: false
      - type: event_trigger
        params: {"event": "break_in_treatment", "threshold_calendar_days_gt": 60, "actions": ["readminister standardized assessment", "collect updated dated data for all targets"]}
        source: cigna_en0499
        section: "Criteria for Continued Treatment with ABA"
        page: 8
        quote: "Administration of a reliable, valid, and standardized assessment instrument (see above Assessment sections for criteria) is completed following any break in treatment greater than 60 calendar days."
        verified: false
      - type: staff_credential
        params: {"roles": ["assessor", "case supervisor", "stakeholder trainer"], "allowed": ["BCBA", "LBA", "independently licensed MH professional with documented ABA training"], "document_name_and_credentials": true}
        source: cigna_en0499
        section: "Treatment Plan > Supervision / Direction of Treatment"
        page: 5
        quote: "The name and credentials of the individual who will provide supervision must be documented."
        verified: false
      - type: plan_content
        params: {"element": "stakeholder training goals", "requires": ["measurable individualized goals with mastery criteria", "dated quantitative baseline", "progress data collection plan", "data separate per stakeholder"]}
        source: cigna_en0499
        section: "Stakeholder Training"
        page: 6
        quote: "There is a clear and documented plan to collect data to demonstrate the stakeholder(s) are making progress toward meeting identified stakeholder training goals."
        verified: false
      - type: plan_content
        params: {"element": "transition plan and discharge criteria", "requires": ["measurable transition plan with fading across all settings", "individualized measurable discharge criteria tied to DSM-5-TR ASD symptoms"]}
        source: cigna_en0499
        section: "Coverage Policy (required ABA components)"
        page: 2
        quote: "Clearly defined, measurable, individualized, and realistic transition plan that includes a plan for fading services from all settings and environments in which treatment is being or will be provided."
        verified: false
      - type: plan_content
        params: {"element": "treatment intensity rationale", "intensity_unit": "direct ABA hours per week excluding supervision and caregiver training"}
        source: cigna_en0499
        section: "Treatment Plan > Treatment Intensity"
        page: 5
        quote: "The planned intensity of treatment reflects the severity of the impairments, goals of treatment, and/or response to treatment across all settings and environments where treatment will occur."
        verified: false
      - type: plan_content
        params: {"element": "intensity increase request", "requires": ["clinical rationale", "quantitative data showing improved outcome", "planned use of added hours"]}
        source: cigna_en0499
        section: "Criteria for Continued Treatment with ABA"
        page: 8
        quote: "Documented evidence and quantitative data demonstrating how the increase in intensity would improve outcome."
        verified: false
      - type: plan_content
        params: {"element": "multiple ABA providers same auth period", "requires": ["coordination plan", "non-duplicative", "consistent strategies", "combined intensity justified"]}
        source: cigna_en0499
        section: "Other Factors"
        page: 6
        quote: "ABA services delivered by multiple ABA provider organizations/agencies/companies during the same authorization period are not considered medically necessary unless ALL the following are present and documented"
        verified: false
      - type: request_timing
        params: {"classification": "continued_vs_initial", "lookback_days": 90}
        source: cigna_en0499
        section: "Glossary > Continued Treatment Authorization Request"
        page: 11
        quote: "the patient has participated in ABA services with the requesting provider within 90 days from the date the authorization request was made."
        verified: false
      - type: request_timing
        params: {"retrospective_if_days_after_requested_start_gt": 90, "or_after_discharge": true}
        source: cigna_en0499
        section: "Glossary > Retrospective Authorization Request"
        page: 13
        quote: "A retrospective authorization request for ABA is any request made when more than 90 days have passed since the start date of the requested authorization, or any time after the patient has discharged."
        verified: false
      - type: concurrent_billing
        params: {"allowed": false, "scope": "ABA at the same time as any other treatment modality (e.g., speech, OT)"}
        source: cigna_en0499
        section: "Not Covered or Reimbursable"
        page: 9
        quote: "Provision of ABA treatment is not covered or reimbursable when delivered to the same individual, at the same time as any other treatment modality (e.g., ABA and speech therapy, or ABA and occupational therapy)."
        verified: false
      - type: plan_content
        params: {"element": "exclusions", "not_covered": ["non-ASD indications incl. Rett", "non-ABA intensive behavioral interventions", "primarily educational or vocational services"]}
        source: cigna_en0499
        section: "Not Medically Necessary / Not Covered"
        page: 9
        quote: "Services that are considered primarily educational or vocational in nature, or related to academic or work performance are not covered or reimbursable."
        verified: false

