# Payor rules seed: Georgia launch market.
#
# EVERY rule ships with verified: false. A rule's status comes from recorded evidence:
# a BCBA verifies it by pasting a sentence from the current official document
# (the `quote` below pre-fills that form; the app still checks it against the live copy).
# Sources:
#   checklist_2026 = one practice's internal auth checklist (secondary source, may be outdated)
#   official docs  = listed under documents
# `page` and `quote` record where the rule was read in the official document.
# Unverified rules may only produce WARN in the evaluator.
# Reviewed against the official documents in docs/PAYOR_DOCUMENTS_REVIEW.md.

documents:
  ga_medicaid_asd_manual:
    name: "GA Medicaid Policies and Procedures for ASD Services"
    version: "Q4 2026 (effective 2026-10-01)"
    effective_date: "2026-10-01"
    # Earlier key: sync renames the stored document, keeping its fetched copies.
    formerly: [ga_medicaid_asd_manual_2026q3]
    # Re-posted quarterly under a new file name: find the current file by its title on the index page.
    locator: {kind: ga_mmis_index, indexUrl: "https://www.mmis.georgia.gov/portal/PubAccess.Provider%20Information/Provider%20Manuals/tabId/17/Default.aspx", title: "Autism Spectrum Disorder Services"}
    url: "https://www.mmis.georgia.gov/portal/Portals/0/StaticContent/Public/ALL/Handbooks/Autism%20Spectrum%20Disorder-Q4%20October%202026%2020261001130506.pdf"
  aetna_aba_request_gr69017_4:
    name: "Aetna Outpatient BH ABA Treatment Request (GR-69017-4)"
    version: "7-26 (effective 2026-08-01)"
    effective_date: "2026-08-01"
    url: "https://www.aetna.com/content/dam/aetna/pdfs/aetnacom/pharmacy-insurance/healthcare-professional/documents/outpatient-behavioral-health-BH-ABA-assessment-precert.pdf"
  aetna_office_manual:
    name: "Aetna Provider Manual (office manual)"
    version: "8102800-01-01 (6/26)"
    url: "https://www.aetna.com/content/dam/aetna/pdfs/aetnacom/health-care-professionals/office_manual_hcp.pdf"
  aetna_aba_mn_guide:
    name: "Aetna Applied Behavior Analysis Medical Necessity Guide"
    version: "7244850-01-01"
    url: "https://www.aetna.com/content/dam/aetna/pdfs/health-care-professionals/applied-behavioral-analysis-necessity-guide.pdf"
  aetna_cpb_0648:
    name: "Aetna Clinical Policy Bulletin 0648: Autism Spectrum Disorders"
    version: "Last review 10/20/2026"
    effective_date: "2026-10-20"
    url: "https://www.aetna.com/cpb/medical/data/600_699/0648.html"
  evernorth_aba_pa_928213d:
    name: "Evernorth ABA Prior Authorization Form (928213d)"
    version: "Rev. 08/2021"
    url: "https://static.cigna.com/assets/chcp/pdf/resourceLibrary/behavioral/applied-behavior-analysis.pdf"
  cigna_en0499:
    name: "Evernorth Behavioral Health Coverage Policy EN0499: Intensive Behavioral Interventions"
    version: "Effective 5/15/2026 (next review 12/15/2026)"
    effective_date: "2026-05-15"
    url: "https://static.cigna.com/assets/chcp/pdf/coveragePolicies/medical/en_mm_0499_coveragepositioncriteria_intensive_behavioral_interventions.pdf"
  anthem_aba_resource_guide:
    name: "Anthem ABA Provider Resource Guide"
    version: "MULTI-BCBS-CM-084583-25 (June 2025)"
    url: "https://www.anthembluecross.com/content/dam/digital/docs/anthembluecross/provider/commercial/forms/aba-provider-resource-guide-abc.pdf"
  umr_aba_doc_reqs:
    name: "UMR Behavioral Health ABA Therapy Documentation Requirements"
    version: "unknown"
    url: "https://stg.umr.com/content/dam/umr/en/findform/forms/UMF0035.pdf"
  humana_military_aba_reassessment:
    name: "Humana Military Request for ABA Reassessment (XPBB0824-A)"
    version: "unknown"
    url: "https://assets.humana.com/is/content/humana/request-for-applied-behavior-analysis-aba-reassessmentpdf"
  # No public copy matches the edition we reviewed: a BCBA uploads the official file (Payor rules, Sources).
  tricare_east_provider_handbook_2026:
    name: "TRICARE Provider Handbook, East Region (Humana Military)"
    version: "2026"
    url: null
  humana_aba_faq_xpbb0825:
    name: "Humana Military ABA Provider FAQ (XPBB0825-C)"
    version: "XPBB0825-C"
    url: null
  triwest_acd_initial_referral:
    name: "TriWest ACD Initial Referral Request for ABA"
    version: "2026-04-15"
    effective_date: "2026-04-15"
    url: "https://tricare.triwest.com/globalassets/tricare/provider/tricare-west-region-autism-care-demonstration-initial-referral-request-applied-behavior-analysis.pdf"
  tricare_tom_c18s3:
    name: "TRICARE Operations Manual (T-5), Chapter 18, Section 3: Autism Care Demonstration"
    version: "As of 2025-01-17 (per manual URL)"
