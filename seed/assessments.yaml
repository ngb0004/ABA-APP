# Assessment catalog: the assessment types a BCBA can record for a client.
#
# Data, not code (validated by src/lib/assessments/catalog.ts at startup).
# CLAUDE.md rule 9: this file holds assessment NAMES and domain / skill-area / subscale NAMES
# only. Never add item wording, protocol text, or scoring instructions from a publisher.
# Ranges (min/max) are listed only where they are well established; otherwise the kind's
# sanity bounds apply (see SCALE_KINDS in catalog.ts).
#
# Fields per type:
#   key, name, group (skills | standardized | other)
#   entry: manual (entry form) | vbmapp_import (the existing VB-MAPP workbook import)
#   forms / respondents: choices shown on the entry form (stored as keys)
#   modules: AFLS-style modules, each with its own skill areas
#   scales: key, name, kind, optional min/max, optional parent (a subdomain of another scale)
#   summary: scale keys shown in the list and used in plan text
#   summary_total: show the sum of the score-of-possible areas as the summary
#   custom_scales: the BCBA may add areas or scales that are not listed here
#   aliases (on a type, form, respondent, or scale): other ways the NAME is written in score
#     reports and spreadsheets, for file imports (abbreviations, shortened names). Names only.
#   group_by_form: repeats are compared per form (e.g., parent vs teacher)
#   payor_names (on a type or form): how payor rules name this tool or form (outcome measure
#     schedules, acceptable tools), e.g. "Vineland-3" or "PDDBI_parent". A rule entry such as
#     "PSI or SIPA" is matched whole first, then each alternative. Unlisted names fall back to
#     attachment titles.
#   suggest_goals: low-scoring areas of the latest confirmed administration suggest goals
#   goal_domain (on a scale): the goal bank domain number (docs/reference/GOAL_BANK.md) whose
#     templates fit this area; areas without one show as "no template yet"
# Open questions about these lists: docs/QUESTIONS_FOR_BCBA.md (Assessments).

version: 1

assessments:
  - key: vbmapp
    name: VB-MAPP
    group: skills
    entry: vbmapp_import
    payor_names: [VB-MAPP]
    scales:
      - { key: total, name: Milestones total, kind: raw, min: 0, max: 170 }
      - { key: level_1, name: Level 1, kind: raw, min: 0, max: 45, parent: total }
      - { key: level_2, name: Level 2, kind: raw, min: 0, max: 60, parent: total }
      - { key: level_3, name: Level 3, kind: raw, min: 0, max: 65, parent: total }
    summary: [total]

  - key: ablls_r
    name: ABLLS-R
    aliases: [ABLLS]
    group: skills
    payor_names: [ABLLS-R, ABLLS]
    suggest_goals: true
    # Scored per skill area as a score of the possible points. The BCBA enters "possible" for
    # each area; item counts are not hard-coded here.
    scales:
      - {
          key: cooperation,
          name: Cooperation and Reinforcer Effectiveness,
          kind: score_of_possible,
          aliases: [Cooperation],
        }
      - { key: visual_performance, name: Visual Performance, kind: score_of_possible, goal_domain: 7 }
      - { key: receptive_language, name: Receptive Language, kind: score_of_possible, goal_domain: 3 }
      - { key: imitation, name: Imitation, kind: score_of_possible, goal_domain: 6 }
      - { key: vocal_imitation, name: Vocal Imitation, kind: score_of_possible, goal_domain: 5 }
      - { key: requests, name: Requests, kind: score_of_possible, goal_domain: 1 }
      - { key: labeling, name: Labeling, kind: score_of_possible, goal_domain: 2 }
      - { key: intraverbals, name: Intraverbals, kind: score_of_possible, goal_domain: 4 }
      - { key: spontaneous_vocalizations, name: Spontaneous Vocalizations, kind: score_of_possible }
      - { key: syntax_grammar, name: Syntax and Grammar, kind: score_of_possible }
      - { key: play_leisure, name: Play and Leisure, kind: score_of_possible, goal_domain: 8 }
      - { key: social_interaction, name: Social Interaction, kind: score_of_possible, goal_domain: 9 }
      - { key: group_instruction, name: Group Instruction, kind: score_of_possible, goal_domain: 10 }
      - { key: classroom_routines, name: Classroom Routines, kind: score_of_possible, goal_domain: 10 }
      - { key: generalized_responding, name: Generalized Responding, kind: score_of_possible }
      - { key: reading, name: Reading, kind: score_of_possible, goal_domain: 14 }
      - { key: math, name: Math, kind: score_of_possible, goal_domain: 14 }
      - { key: writing, name: Writing, kind: score_of_possible, goal_domain: 14 }
      - { key: spelling, name: Spelling, kind: score_of_possible, goal_domain: 14 }
      - { key: dressing, name: Dressing, kind: score_of_possible, goal_domain: 12 }
      - { key: eating, name: Eating, kind: score_of_possible, goal_domain: 12 }
      - { key: grooming, name: Grooming, kind: score_of_possible, goal_domain: 12 }
      - { key: toileting, name: Toileting, kind: score_of_possible, goal_domain: 11 }
      - { key: gross_motor, name: Gross Motor, kind: score_of_possible }
      - { key: fine_motor, name: Fine Motor, kind: score_of_possible }
    summary_total: true

  - key: afls
    name: AFLS
    group: skills
    payor_names: [AFLS]
    suggest_goals: true
    custom_scales: true
    summary_total: true
    # Only the Basic Living Skills areas are listed; the other modules start empty and the BCBA
    # adds the areas scored (question in QUESTIONS_FOR_BCBA.md).
    modules:
      - key: basic_living
        name: Basic Living Skills
        scales:
          - { key: self_management, name: Self-Management, kind: score_of_possible, goal_domain: 15 }
          - { key: basic_communication, name: Basic Communication, kind: score_of_possible }
          - { key: dressing, name: Dressing, kind: score_of_possible, goal_domain: 12 }
          - { key: eating, name: Eating, kind: score_of_possible, goal_domain: 12 }
          - { key: grooming, name: Grooming, kind: score_of_possible, goal_domain: 12 }
          - { key: bathing, name: Bathing, kind: score_of_possible, goal_domain: 12 }
          - { key: toileting, name: Toileting, kind: score_of_possible, goal_domain: 11 }
          - { key: health, name: Health, kind: score_of_possible }
          - { key: safety, name: Safety, kind: score_of_possible, goal_domain: 13 }
          - { key: nighttime_routines, name: Nighttime Routines, kind: score_of_possible, goal_domain: 12 }
      - { key: home, name: Home Skills, scales: [] }
      - { key: community, name: Community Participation Skills, scales: [] }
      - { key: school, name: School Skills, scales: [] }
      - { key: vocational, name: Vocational Skills, scales: [] }
      - { key: independent_living, name: Independent Living Skills, scales: [] }

  - key: vineland_3
    name: Vineland-3
    aliases: [Vineland, Vineland-III, Vineland Adaptive Behavior Scales]
    group: standardized
    payor_names: [Vineland-3, Vineland]
    forms:
      - { key: comprehensive_interview, name: Comprehensive Interview Form }
      - { key: domain_interview, name: Domain-Level Interview Form }
      - { key: parent_caregiver, name: Parent/Caregiver Form, aliases: [Parent Form, Caregiver Form] }
      - { key: teacher, name: Teacher Form }
    respondents: &respondents
      - {
          key: parent_caregiver,
          name: Parent or caregiver,
          aliases: [Parent, Caregiver, Parent/Caregiver, Mother, Father, Guardian],
        }
      - { key: teacher, name: Teacher }
      - { key: self, name: Self, aliases: [Self-report] }
      - { key: clinician, name: Clinician, aliases: [BCBA, Examiner] }
      - { key: other, name: Other }
    scales:
      - { key: abc, name: Adaptive Behavior Composite, kind: standard, min: 20, max: 140, aliases: [ABC] }
      - { key: communication, name: Communication, kind: standard, min: 20, max: 140, aliases: [COM] }
      - {
          key: daily_living,
          name: Daily Living Skills,
          kind: standard,
          min: 20,
          max: 140,
          aliases: [DLS, Daily Living],
        }
      - { key: socialization, name: Socialization, kind: standard, min: 20, max: 140, aliases: [SOC] }
      - { key: motor, name: Motor Skills, kind: standard, min: 20, max: 140, aliases: [MOT, Motor] }
      - { key: abc_pct, name: Adaptive Behavior Composite percentile, kind: percentile, parent: abc }
      - { key: communication_pct, name: Communication percentile, kind: percentile, parent: communication }
      - {
          key: daily_living_pct,
          name: Daily Living Skills percentile,
          kind: percentile,
          parent: daily_living,
        }
      - { key: socialization_pct, name: Socialization percentile, kind: percentile, parent: socialization }
      - { key: motor_pct, name: Motor Skills percentile, kind: percentile, parent: motor }
      - { key: receptive, name: Receptive (v-scale), kind: standard, min: 1, max: 24, parent: communication }
      - {
          key: expressive,
          name: Expressive (v-scale),
          kind: standard,
          min: 1,
          max: 24,
          parent: communication,
        }
      - { key: written, name: Written (v-scale), kind: standard, min: 1, max: 24, parent: communication }
      - { key: personal, name: Personal (v-scale), kind: standard, min: 1, max: 24, parent: daily_living }
      - { key: domestic, name: Domestic (v-scale), kind: standard, min: 1, max: 24, parent: daily_living }
      - { key: community, name: Community (v-scale), kind: standard, min: 1, max: 24, parent: daily_living }
      - {
          key: interpersonal,
          name: Interpersonal Relationships (v-scale),
          kind: standard,
          min: 1,
          max: 24,
          parent: socialization,
        }
      - {
          key: play_leisure,
          name: Play and Leisure (v-scale),
          kind: standard,
          min: 1,
          max: 24,
          parent: socialization,
        }
      - { key: coping, name: Coping Skills (v-scale), kind: standard, min: 1, max: 24, parent: socialization }
      - { key: fine_motor, name: Fine Motor (v-scale), kind: standard, min: 1, max: 24, parent: motor }
      - { key: gross_motor, name: Gross Motor (v-scale), kind: standard, min: 1, max: 24, parent: motor }
      - {
          key: maladaptive_index,
          name: Maladaptive Behavior Index (v-scale),
          kind: standard,
          min: 1,
          max: 24,
        }
      - {
          key: internalizing,
          name: Internalizing (v-scale),
          kind: standard,
          min: 1,
          max: 24,
          parent: maladaptive_index,
        }
      - {
          key: externalizing,
          name: Externalizing (v-scale),
          kind: standard,
          min: 1,
          max: 24,
          parent: maladaptive_index,
        }
    summary: [abc, communication, daily_living, socialization]

  - key: srs_2
    name: SRS-2
    aliases: [SRS, Social Responsiveness Scale]
    group: standardized
    payor_names: [SRS-2, SRS]
    forms:
      - { key: preschool, name: Preschool Form }
      - { key: school_age, name: School-Age Form }
      - { key: adult, name: Adult Form }
    respondents: *respondents
    scales:
      - { key: total_t, name: Total, kind: t_score, aliases: [SRS-2 Total, Total score] }
      - { key: total_raw, name: Total raw score, kind: raw, parent: total_t }
      - {
          key: sci,
          name: Social Communication and Interaction,
          kind: t_score,
          parent: total_t,
          aliases: [SCI],
        }
      - {
          key: rrb,
          name: Restricted Interests and Repetitive Behavior,
          kind: t_score,
          parent: total_t,
          aliases: [RRB],
        }
      - {
          key: social_awareness,
          name: Social Awareness,
          kind: t_score,
          parent: total_t,
          aliases: [Awareness],
        }
      - {
          key: social_cognition,
          name: Social Cognition,
          kind: t_score,
          parent: total_t,
          aliases: [Cognition],
        }
      - {
          key: social_communication,
          name: Social Communication,
          kind: t_score,
          parent: total_t,
          aliases: [Communication],
        }
      - {
          key: social_motivation,
          name: Social Motivation,
          kind: t_score,
          parent: total_t,
          aliases: [Motivation],
        }
    summary: [total_t]

  - key: pddbi
    name: PDDBI
    aliases: [PDD Behavior Inventory]
    group: standardized
    payor_names: [PDDBI]
    custom_scales: true
    group_by_form: true
    forms:
      - { key: parent, name: Parent Form, payor_names: [PDDBI_parent] }
      # The teacher form, completed by a teacher or the BCBA.
      - { key: teacher, name: Teacher Form, payor_names: [PDDBI_teacher, PDDBI_teacher_or_BCBA] }
    respondents: *respondents
    # Kept minimal on purpose; the BCBA adds any other domain T-scores reported.
    scales:
      - { key: autism_composite, name: Autism Composite, kind: t_score }
      - { key: sensory_perceptual, name: Sensory/Perceptual Approach Behaviors, kind: t_score }
      - { key: ritualisms, name: Ritualisms/Resistance to Change, kind: t_score }
      - { key: social_pragmatic, name: Social Pragmatic Problems, kind: t_score }
      - { key: semantic_pragmatic, name: Semantic/Pragmatic Problems, kind: t_score }
      - { key: arousal_regulation, name: Arousal Regulation Problems, kind: t_score }
      - { key: specific_fears, name: Specific Fears, kind: t_score }
      - { key: aggressiveness, name: Aggressiveness, kind: t_score }
      - { key: social_approach, name: Social Approach Behaviors, kind: t_score }
      - { key: expressive_language, name: Expressive Language, kind: t_score }
      - { key: learning_memory_receptive, name: "Learning, Memory, and Receptive Language", kind: t_score }
    summary: [autism_composite]

  - key: psi_4
    name: PSI-4
    aliases: [PSI, Parenting Stress Index]
    group: standardized
    payor_names: [PSI-4, PSI]
    custom_scales: true
    forms:
      - { key: full_length, name: Full-Length Form }
      - { key: short_form, name: Short Form }
    respondents: *respondents
    scales:
      - { key: total_stress_pct, name: Total Stress percentile, kind: percentile, aliases: [Total Stress] }
      - { key: total_stress_raw, name: Total Stress raw score, kind: raw, parent: total_stress_pct }
      - { key: child_domain_pct, name: Child Domain percentile, kind: percentile, aliases: [Child Domain] }
      - { key: parent_domain_pct, name: Parent Domain percentile, kind: percentile, aliases: [Parent Domain] }
    summary: [total_stress_pct]

  - key: sipa
    name: SIPA
    aliases: [Stress Index for Parents of Adolescents]
    group: standardized
    payor_names: [SIPA]
    custom_scales: true
    respondents: *respondents
    scales:
      - { key: total_stress_pct, name: Total Stress percentile, kind: percentile, aliases: [Total Stress] }
      - { key: total_stress_raw, name: Total Stress raw score, kind: raw, parent: total_stress_pct }
      - {
          key: adolescent_domain_pct,
          name: Adolescent Domain percentile,
          kind: percentile,
          aliases: [Adolescent Domain],
        }
      - { key: parent_domain_pct, name: Parent Domain percentile, kind: percentile, aliases: [Parent Domain] }
    summary: [total_stress_pct]

  - key: peak
    name: PEAK
    group: skills
    custom_scales: true
    summary_total: true
    scales:
      - { key: direct_training, name: Direct Training, kind: score_of_possible }
      - { key: generalization, name: Generalization, kind: score_of_possible }
      - { key: equivalence, name: Equivalence, kind: score_of_possible }
      - { key: transformation, name: Transformation, kind: score_of_possible }

  - key: efl
    name: Essential for Living
    aliases: [EFL]
    group: skills
    custom_scales: true
    summary_total: true
    scales:
      - { key: communication, name: Communication, kind: score_of_possible }
      - { key: daily_living, name: Daily Living, kind: score_of_possible }
      - { key: tolerating, name: Tolerating, kind: score_of_possible }
      - { key: functional_academic, name: Functional Academic, kind: score_of_possible }

  - key: other
    name: Other assessment
    group: other
    # The BCBA names the assessment and adds each score.
    custom_scales: true
    scales: []
